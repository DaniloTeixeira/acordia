<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{
  --bg:#E9EDF2; --panel:#FFFFFF; --ink:#18212F; --muted:#5A6576; --line:#CBD3DE;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --field:#F7F9FB; --warn:#9A3412; --warn-bg:#FFF1E8;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161E; --panel:#1A212C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2E3846;
    --accent:#6FA8DC; --accent-ink:#0E1621; --field:#141A23; --warn:#FDBA74; --warn-bg:#2A1C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161E; --panel:#1A212C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2E3846;
  --accent:#6FA8DC; --accent-ink:#0E1621; --field:#141A23; --warn:#FDBA74; --warn-bg:#2A1C12;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:24px;padding:24px;max-width:1400px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:1fr;padding:14px}}
h1{font-size:1.35rem;font-weight:600;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:16px}
label.inline{display:flex;gap:8px;align-items:center;font-size:.92rem}
select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.song{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.song-head span{display:flex;gap:8px;align-items:center}
.song-title{font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block!important}
.song-actions{flex-shrink:0;gap:4px!important}
.lib-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.filebtn{font-weight:500;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);color:var(--accent)}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sec{font-size:1.05rem;font-weight:600;margin:26px 0 10px}
#lib-count{color:var(--muted);font-weight:400}
.lib input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.lib .status{margin:8px 0 4px}
#lib-list{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto}
#lib-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
#lib-list li:first-child{border-top:none}
.lib-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lib-empty{color:var(--muted);font-size:.9rem;display:block!important}
.in-use{font-size:.8rem;color:var(--muted)}
button.link.danger{color:var(--warn);font-weight:600}
.controls .link{margin-left:auto}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.song-keys[hidden]{display:none}
.add-row .add{margin-top:0}
.badge{font-size:.75rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-right:4px}
button.move{background:transparent;color:var(--accent);padding:2px 9px;line-height:1.3}
button.move:disabled{opacity:.35;cursor:default}
.song-keys{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:8px;font-size:.88rem}
.song-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:190px;resize:vertical;font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.35;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre;overflow-x:auto}
button{font:inherit;font-weight:500;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.link{border:none;background:none;color:var(--muted);padding:2px 4px;font-size:.85rem;text-decoration:underline}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add{margin-top:14px;width:100%}
.preview{display:flex;flex-direction:column;gap:22px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sheet-head h2{font-size:1rem;margin:0;font-weight:600}
.paper{background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.18);width:100%;max-width:760px;aspect-ratio:595.28/841.89}
.paper svg{display:block;width:100%;height:100%}
.note{font-size:.88rem;padding:9px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin:0 0 8px}
.empty{color:var(--muted);font-size:.92rem;padding:30px 0}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app{display:block;padding:0}
  .editor,.sheet-head,.note,.status{display:none!important}
  .preview{gap:0}
  .paper{box-shadow:none;border-radius:0;max-width:none;width:210mm;height:297mm;break-after:page}
}
</style>
</head>
<body>
<div class="app">
  <section class="editor">
    <h1>Medley Generator</h1>
    <p class="lead">Cole cada música com o título na primeira linha. A folha remove marcações como [Refrão], tira blocos repetidos e ajusta o tamanho da letra para ocupar a página toda.</p>
    <div class="panel">
      <div class="controls">
        <label class="inline"><input type="checkbox" id="dedupe" checked> Remover repetições</label>
        <button class="link" id="new-seq">Nova sequência</button>
      </div>
      <div id="songs"></div>
      <div class="add-row"><button class="ghost add" id="add">Adicionar música com cifra</button><button class="ghost add" id="add-lyrics">Adicionar só letra</button></div>
    </div>
    <h2 class="sec">Biblioteca <span id="lib-count"></span></h2>
    <div class="panel lib">
      <input type="search" id="lib-q" placeholder="Buscar por título ou trecho" aria-label="Buscar na biblioteca">
      <p class="status" id="lib-status" aria-live="polite"></p>
      <ul id="lib-list"></ul>
      <div class="lib-tools"><button class="ghost" id="lib-export">Exportar biblioteca</button><label class="ghost filebtn" id="lib-import-wrap">Importar biblioteca<input type="file" id="lib-import" accept="application/json,.json" hidden></label></div>
    </div>
  </section>

  <section class="preview" id="preview"></section>
</div>

<script>
(function(){
"use strict";
const {NOTES, KEYS, parseSong, dedupeBlocks, lineToDegrees, lineTranspose, detectKey, songTitle, sanitizeEntry} = window.Cifras;

// ---------- state ----------
let state = {key:"E", dedupe:true, songs:[""], keys:[], targets:[], types:[]};
try{ const s = JSON.parse(localStorage.getItem("folha-cifras-v1")||"null"); if(s && Array.isArray(s.songs)) state = Object.assign(state, s); }catch(e){}
if(!Array.isArray(state.keys)) state.keys = [];
if(!Array.isArray(state.targets)) state.targets = [];
if(!Array.isArray(state.types)) state.types = [];
if(!Array.isArray(state.libIds)) state.libIds = [];
function save(){ try{ localStorage.setItem("folha-cifras-v1", JSON.stringify(state)); }catch(e){} }

// ---------- layout ----------
const PW = 595.28, PH = 841.89, M = 32, GAP = 22, COLW = (PW - 2*M - GAP)/2, CW = 0.632;
const TITLE_SIZE = 14;

function wrapItem(it, maxCols){
  const len = Math.max((it.chord||"").length,(it.lyric||"").length);
  if(len <= maxCols) return [it];
  const lyr = it.lyric || "", ch = it.chord || "";
  let p = -1;
  for(let c = Math.min(maxCols, lyr.length-1); c > 4; c--){
    if(lyr[c-1]===" " && lyr[c]!==" " && (c>=ch.length || ch[c-1]===" ")) { p = c; break; }
  }
  if(p<0) return [it];
  const restL = lyr.slice(p), restC = ch.slice(p);
  const a = {kind:it.kind, chord: ch.slice(0,p).replace(/\s+$/,""), lyric: lyr.slice(0,p).replace(/\s+$/,"")};
  const b = {kind:it.kind, chord: restC, lyric: restL};
  if(!a.chord) a.kind = a.lyric ? "lyric" : a.kind;
  if(!b.chord.trim()) { b.kind = "lyric"; delete b.chord; }
  return [a, ...wrapItem(b, maxCols)];
}

const MEASURE = document.createElement("canvas").getContext("2d");
// Largura medida a 100px e guardada; o ajuste de tamanho mede os mesmos textos dezenas de vezes.
const widths = new Map();
function textW(t, fs){
  let w = widths.get(t);
  if(w===undefined){ MEASURE.font = "100px Lexend, AHSans, sans-serif"; w = MEASURE.measureText(t).width; widths.set(t, w); }
  return w * fs / 100;
}
function lyricsOnly(songs){
  return songs.map(s=>Object.assign({}, s, {blocks: s.blocks
    .map(b=>b.filter(it=>it.lyric!==undefined).map(it=>({kind:"lyric", lyric: it.lyric.replace(/_+/g,"").replace(/\s+/g," ").trim()})).filter(it=>it.lyric))
    .filter(b=>b.length)}));
}
function wrapWords(it, fs){
  const max = COLW*0.97, words = it.lyric.split(" "), out = []; let cur = "";
  words.forEach(w=>{ const t = cur ? cur + " " + w : w; if(textW(t, fs) <= max || !cur) cur = t; else { out.push({kind:"lyric", lyric:cur}); cur = w; } });
  if(cur) out.push({kind:"lyric", lyric:cur});
  return out;
}

function layout(songs, fs, k, mode){
  const maxCols = Math.floor(COLW/(CW*fs));
  const L = mode==="letra";
  const CH = fs*1.05, LY = L ? fs*(1.15+0.25*k) : fs*1.32*k, CO = fs*1.5*k, BG = L ? fs*1.3*k : fs*0.95*k, TH = TITLE_SIZE + 10, SG = 12*k;
  const ops = []; let col = 0, y = M, overflow = false, tooWide = false;
  const x = () => M + col*(COLW+GAP);
  const bottom = PH - M;
  function itemH(it){ return it.kind==="pair" ? CH+LY : it.kind==="chord" ? CO : LY; }
  function nextCol(){ col++; y = M; if(col>1) overflow = true; }
  songs.forEach((s, si)=>{
    const blocks = s.blocks.map(b=>b.flatMap(it=>mode==="letra" ? wrapWords(it, fs) : wrapItem(it, maxCols)));
    if(mode!=="letra") blocks.forEach(b=>b.forEach(it=>{ if(Math.max((it.chord||"").length,(it.lyric||"").length) > maxCols) tooWide = true; }));
    const firstH = blocks.length ? blocks[0].reduce((h,it)=>h+itemH(it),0) : 0;
    if(si>0) y += SG;
    if(y + TH + firstH > bottom && y > M) nextCol();
    ops.push({t:"text",x:x(),y:y+TITLE_SIZE*0.85,s:TITLE_SIZE,f:mode==="letra"?"lex":"sans",b:true,c:[31,78,121],txt:s.title.toUpperCase()});
    ops.push({t:"line",x1:x(),x2:x()+COLW,y:y+TITLE_SIZE+3,c:[31,78,121],w:0.9});
    y += TH;
    blocks.forEach((b, bi)=>{
      const h = b.reduce((h,it)=>h+itemH(it),0) + (bi?BG:0);
      if(y + h > bottom && y > M + TH) nextCol(); else if(bi) y += BG;
      b.forEach(it=>{
        if(y + itemH(it) > bottom) nextCol();
        if(it.chord!==undefined && it.chord!==null){
          const txt = mode==="graus" ? lineToDegrees(it.chord, s.key) : lineTranspose(it.chord, s.shift, s.target);
          ops.push({t:"text",x:x(),y:y+fs*0.82,s:fs,f:"mono",b:true,c:[176,32,26],txt});
          y += it.kind==="pair" ? CH : CO;
        }
        if(it.lyric!==undefined){
          ops.push({t:"text",x:x(),y:y+fs*0.82,s:fs,f:mode==="letra"?"lex":"mono",b:false,c:[17,17,17],txt:it.lyric});
          y += LY;
        }
      });
    });
  });
  if(col===1) ops.push({t:"line",x1:M+COLW+GAP/2,x2:M+COLW+GAP/2,y1:M,y2:PH-M,c:[205,205,205],w:0.5,v:true});
  return {ops, overflow, tooWide};
}

function fit(songs, mode){
  let best = null, maxLen = 1;
  songs.forEach(s=>s.blocks.forEach(b=>b.forEach(it=>{
    const ch = it.chord ? (mode==="graus" ? lineToDegrees(it.chord, s.key) : lineTranspose(it.chord, s.shift, s.target)) : "";
    maxLen = Math.max(maxLen, ch.length, (it.lyric||"").length);
  })));
  const noWrap = mode==="letra"
    ? COLW*0.97/Math.max(1e-6, ...songs.flatMap(s=>s.blocks.flatMap(b=>b.map(it=>textW(it.lyric||"",100)/100))))
    : COLW/(CW*maxLen);
  const top = mode==="letra" ? 18 : 15;
  const start = noWrap >= 11 ? Math.min(top, Math.floor(noWrap*4)/4) : top;
  for(let fs = start; fs >= 9; fs -= 0.25){
    const r = layout(songs, fs, 1, mode);
    if(!r.overflow){ best = {fs, r}; break; }
  }
  if(!best) return {res: layout(songs, 9, 1, mode), warn:"Não coube em uma folha. Tire uma música ou desmarque algo repetido."};
  let lo = 1, hi = 2.2;
  for(let i=0;i<18;i++){ const mid=(lo+hi)/2; if(layout(songs,best.fs,mid,mode).overflow) hi=mid; else lo=mid; }
  const res = layout(songs, best.fs, lo, mode);
  return {res, warn: res.tooWide ? "Uma linha ficou larga demais para a coluna e pode cortar." : null};
}

// ---------- rendering ----------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toSVG(ops){
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Pré-visualização da folha">`;
  ops.forEach(o=>{
    const col = `rgb(${o.c.join(",")})`;
    if(o.t==="text"){
      const fam = o.f==="mono" ? `AHMono,'Courier New',monospace` : o.f==="lex" ? `Lexend,AHSans,sans-serif` : `AHSans,Helvetica,Arial,sans-serif`;
      s += `<text x="${o.x}" y="${o.y}" font-family="${fam}" font-size="${o.s}" font-weight="${o.b?700:400}" fill="${col}" style="white-space:pre">${esc(o.txt)}</text>`;
    } else if(o.v){
      s += `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${col}" stroke-width="${o.w}"/>`;
    } else {
      s += `<line x1="${o.x1}" y1="${o.y}" x2="${o.x2}" y2="${o.y}" stroke="${col}" stroke-width="${o.w}"/>`;
    }
  });
  return s + "</svg>";
}
// [arquivo, família na tela, peso, nome no jsPDF, estilo no jsPDF]
const FONTS = [
  ["atkinson-mono-regular","AHMono","400","ahmono","normal"], ["atkinson-mono-bold","AHMono","700","ahmono","bold"],
  ["atkinson-regular","AHSans","400","ahsans","normal"], ["atkinson-bold","AHSans","700","ahsans","bold"],
  ["lexend-regular","Lexend","400","lexend","normal"], ["lexend-bold","Lexend","700","lexend","bold"]
];
const fontURL = f => "fonts/" + f + ".ttf";
// O jsPDF recebe as fontes em base64; só busca na primeira vez que alguém baixa um PDF.
let pdfFonts = null;
function loadPdfFonts(){
  if(!pdfFonts) pdfFonts = Promise.all(FONTS.map(async ([f])=>{
    const r = await fetch(fontURL(f)); if(!r.ok) throw new Error(f);
    const u = new Uint8Array(await r.arrayBuffer()); let s = "";
    for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
    return btoa(s);
  })).catch(e=>{ pdfFonts = null; throw e; });
  return pdfFonts;
}
async function toPDF(ops){
  const fonts = await loadPdfFonts();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  FONTS.forEach(([f,,,n,st], i)=>{ doc.addFileToVFS(f+".ttf", fonts[i]); doc.addFont(f+".ttf", n, st); });
  ops.forEach(o=>{
    if(o.t==="text"){
      doc.setFont(o.f==="mono" ? "ahmono" : o.f==="lex" ? "lexend" : "ahsans", o.b ? "bold" : "normal"); doc.setFontSize(o.s); doc.setTextColor(...o.c);
      doc.text(o.txt, o.x, o.y);
    } else {
      doc.setDrawColor(...o.c); doc.setLineWidth(o.w);
      if(o.v) doc.line(o.x1,o.y1,o.x2,o.y2); else doc.line(o.x1,o.y,o.x2,o.y);
    }
  });
  return doc.output("blob");
}

const last = {};
function saveBlob(blob, filename){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function renderPreview(){
  const pv = document.getElementById("preview");
  let songs = state.songs.map((t,i)=>({t,i})).filter(o=>o.t.trim()).map(o=>{
    const s = parseSong(o.t, state.types[o.i]==="letra"), auto = detectKey(s);
    const opt = document.querySelector(`select[data-key="${o.i}"] option[value=""]`);
    if(opt) opt.textContent = "Automático (" + auto + ")";
    const key = state.keys[o.i]||auto, target = state.targets[o.i]||"";
    return Object.assign(s,{key, target, shift: target ? (NOTES[target]-NOTES[key]+12)%12 : 0});
  }).filter(s=>s.title);
  if(state.dedupe) songs = dedupeBlocks(songs);
  if(!songs.length){ pv.innerHTML = `<p class="empty">Cole a primeira música ao lado para ver a folha aqui.</p>`; return; }
  pv.innerHTML = "";
  [["cifras","Com cifras"],["graus","Com graus"],["letra","Só letra"]].forEach(([mode,label])=>{
    const {res, warn} = fit(mode==="letra" ? lyricsOnly(songs) : songs, mode);
    last[mode] = res.ops;
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="sheet-head"><h2>${esc(label)}</h2><div><button data-mode="${mode}" class="dl">Baixar PDF</button></div></div>
      ${warn?`<p class="note">${esc(warn)}</p>`:""}<div class="paper">${toSVG(res.ops)}</div><p class="status" id="st-${mode}"></p>`;
    pv.appendChild(wrap);
  });
  pv.querySelectorAll(".dl").forEach(b=>b.addEventListener("click", ()=>download(b.dataset.mode)));
  const printBtn = document.createElement("button");
  printBtn.className = "ghost"; printBtn.textContent = "Imprimir as três folhas";
  printBtn.addEventListener("click", ()=>window.print());
  pv.querySelectorAll(".sheet-head")[0].querySelector("div").appendChild(printBtn);
  if(!window.jspdf) pv.querySelectorAll(".dl").forEach(b=>b.hidden = true);
}

async function download(mode){
  const st = document.getElementById("st-"+mode);
  if(!window.jspdf){ st.textContent = "Baixar não está disponível aqui. Use Imprimir e escolha Salvar como PDF."; return; }
  const first = (state.songs.find(t=>t.trim())||"folha").trim().split("\n")[0].trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"");
  try{
    saveBlob(await toPDF(last[mode]), `${first||"folha"}-${mode}.pdf`);
    st.textContent = "PDF salvo.";
  }catch(e){
    st.textContent = "Não foi possível baixar aqui. Use Imprimir e escolha Salvar como PDF.";
  }
}

// ---------- editor ----------
function renderEditor(){
  const box = document.getElementById("songs"); box.innerHTML = "";
  state.songs.forEach((txt, i)=>{
    const d = document.createElement("div"); d.className = "song";
    d.innerHTML = `<div class="song-head"><span class="song-title"></span><span class="song-actions">${state.types[i]==="letra"?`<span class="badge">Só letra</span>`:""}${state.songs.length>1?`<button class="move" data-mv="${i},-1" aria-label="Subir música" ${i===0?"disabled":""}>↑</button><button class="move" data-mv="${i},1" aria-label="Descer música" ${i===state.songs.length-1?"disabled":""}>↓</button><button class="link" data-rm="${i}">Remover</button>`:""}</span></div>
      <div class="song-keys" ${state.types[i]==="letra"?"hidden":""}><label class="inline">Tom da cifra colada <select data-key="${i}"><option value="">Automático</option>${KEYS.map(k=>`<option ${state.keys[i]===k?"selected":""}>${k}</option>`).join("")}</select></label>
      <label class="inline">Tocar em <select data-target="${i}"><option value="">Mesmo tom</option>${KEYS.map(k=>`<option ${state.targets[i]===k?"selected":""}>${k}</option>`).join("")}</select></label></div>
      <textarea spellcheck="false" aria-label="Cifra da música ${i+1}" placeholder="${state.types[i]==="letra" ? "Título da música&#10;&#10;Primeira linha da letra...&#10;Segunda linha..." : "Título da música&#10;&#10;E&#10;Primeira linha da letra..."}"></textarea>`;
    const ta = d.querySelector("textarea"); ta.value = txt;
    const st = d.querySelector(".song-title");
    const setTitle = ()=>{ const t = (ta.value.split("\n").find(l=>l.trim())||"").trim(); st.textContent = (i+1) + ". " + (t || "Nova música"); };
    setTitle(); ta.addEventListener("input", setTitle);
    d.querySelector("[data-key]").addEventListener("change", e=>{ state.keys[i] = e.target.value; save(); renderPreview(); scheduleLibSave(); });
    d.querySelector("[data-target]").addEventListener("change", e=>{ state.targets[i] = e.target.value; save(); renderPreview(); scheduleLibSave(); });
    let tmr; ta.addEventListener("input", ()=>{ state.songs[i] = ta.value; save(); clearTimeout(tmr); tmr = setTimeout(renderPreview, 250); scheduleLibSave(); });
    box.appendChild(d);
  });
  box.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click", ()=>{
    const [i, dir] = b.dataset.mv.split(",").map(Number), j = i + dir;
    if(j < 0 || j >= state.songs.length) return;
    [state.songs, state.keys, state.targets, state.types, state.libIds].forEach(a=>{ const t = a[i]; a[i] = a[j]; a[j] = t; });
    save(); renderEditor(); renderPreview();
    const btn = document.querySelector(`[data-mv="${j},${dir}"]`) || document.querySelector(`[data-mv="${j},${-dir}"]`); if(btn) btn.focus();
  }));
  box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click", ()=>{ state.songs.splice(+b.dataset.rm,1); state.keys.splice(+b.dataset.rm,1); state.targets.splice(+b.dataset.rm,1); state.types.splice(+b.dataset.rm,1); state.libIds.splice(+b.dataset.rm,1); save(); renderEditor(); renderPreview(); renderLibrary(); }));
}

// ---------- library ----------
let lib = [];
const LOCAL_LIB = "folha-biblioteca-v1";
function normTitle(t){ return (t||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," "); }
function localLib(){
  try{ const a = JSON.parse(localStorage.getItem(LOCAL_LIB)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function persistLocal(){ try{ localStorage.setItem(LOCAL_LIB, JSON.stringify(lib)); }catch(e){ setLibStatus("N\u00e3o foi poss\u00edvel salvar na biblioteca agora."); } }
function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let libTimer = null;
function scheduleLibSave(){ clearTimeout(libTimer); libTimer = setTimeout(saveSequenceToLibrary, 1200); }
function saveSequenceToLibrary(){
  let changed = false;
  for(let i=0;i<state.songs.length;i++){
    const text = state.songs[i], title = songTitle(text);
    if(!title || text.split("\n").filter(l=>l.trim()).length < 2) continue;
    let id = state.libIds[i];
    if(!id){ const same = lib.find(e=>normTitle(e.title)===normTitle(title)); id = same ? same.id : newId(); state.libIds[i] = id; save(); }
    const entry = {title, text, type: state.types[i]||"", key: state.keys[i]||"", target: state.targets[i]||""};
    const cur = lib.find(e=>e.id===id);
    if(cur && cur.title===entry.title && cur.text===entry.text && cur.type===entry.type && cur.key===entry.key && cur.target===entry.target) continue;
    entry.updatedAt = Date.now();
    const k = lib.findIndex(e=>e.id===id); const row = Object.assign({id}, entry);
    if(k<0) lib.push(row); else lib[k] = row;
    changed = true;
  }
  if(changed){ persistLocal(); renderLibrary(); }
}
function deleteFromLibrary(id){
  lib = lib.filter(e=>e.id!==id); persistLocal();
  state.libIds = state.libIds.map(x=>x===id ? "" : x); save();
  renderLibrary();
}
function addFromLibrary(id){
  const e = lib.find(x=>x.id===id); if(!e) return;
  let i = state.songs.length;
  if(state.songs.length===1 && !state.songs[0].trim()) i = 0;
  state.songs[i] = e.text; state.types[i] = e.type||""; state.keys[i] = e.key||""; state.targets[i] = e.target||""; state.libIds[i] = e.id;
  save(); renderEditor(); renderPreview(); renderLibrary();
  setLibStatus(`\u201c${e.title}\u201d entrou na sequ\u00eancia.`);
}
function setLibStatus(t){ const el = document.getElementById("lib-status"); if(el) el.textContent = t; }
function renderLibrary(){
  const list = document.getElementById("lib-list"); if(!list) return;
  const q = normTitle(document.getElementById("lib-q").value);
  const inSeq = new Set(state.libIds.filter(Boolean));
  const rows = lib.filter(e=>!q || normTitle(e.title).includes(q) || normTitle(e.text).includes(q))
                  .sort((a,b)=>a.title.localeCompare(b.title,"pt-BR"));
  document.getElementById("lib-count").textContent = lib.length ? `(${lib.length})` : "";
  if(!lib.length){ list.innerHTML = `<li class="lib-empty">As m\u00fasicas que voc\u00ea colar na sequ\u00eancia ficam salvas aqui automaticamente.</li>`; return; }
  if(!rows.length){ list.innerHTML = `<li class="lib-empty">Nenhuma m\u00fasica encontrada.</li>`; return; }
  list.innerHTML = "";
  rows.forEach(e=>{
    const li = document.createElement("li");
    li.innerHTML = `<span class="lib-name"></span><span class="lib-actions">${e.type==="letra"?`<span class="badge">S\u00f3 letra</span>`:""}${inSeq.has(e.id)?`<span class="in-use">Na sequ\u00eancia</span>`:`<button class="move lib-add">Adicionar</button>`}<button class="link lib-del">Excluir</button></span>`;
    li.querySelector(".lib-name").textContent = e.title;
    const add = li.querySelector(".lib-add"); if(add) add.addEventListener("click", ()=>addFromLibrary(e.id));
    const del = li.querySelector(".lib-del"); let armed = null;
    del.addEventListener("click", ()=>{
      if(armed){ clearTimeout(armed); deleteFromLibrary(e.id); return; }
      del.textContent = "Confirmar exclus\u00e3o"; del.classList.add("danger");
      armed = setTimeout(()=>{ armed = null; del.textContent = "Excluir"; del.classList.remove("danger"); }, 3500);
    });
    list.appendChild(li);
  });
}
function initLibrary(){
  lib = localLib(); renderLibrary();
  setLibStatus("Salvo neste aparelho. Use Exportar de vez em quando para ter um backup.");
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}

document.getElementById("lib-q").addEventListener("input", renderLibrary);
function libraryJSON(){ return JSON.stringify({app:"folha-de-cifras", version:1, exportedAt:new Date().toISOString(), songs: lib.map(({id,title,text,type,key,target,updatedAt})=>({id,title,text,type,key,target,updatedAt}))}, null, 2); }
document.getElementById("lib-export").addEventListener("click", ()=>{
  if(!lib.length){ setLibStatus("A biblioteca está vazia."); return; }
  saveBlob(new Blob([libraryJSON()], {type:"application/json"}), "biblioteca-cifras-" + new Date().toISOString().slice(0,10) + ".json");
  setLibStatus("Biblioteca exportada.");
});
document.getElementById("lib-import").addEventListener("change", async e=>{
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const data = JSON.parse(await f.text()); const songs = Array.isArray(data) ? data : data && data.songs;
    if(!Array.isArray(songs)) throw 0;
    let n = 0;
    for(const raw of songs){
      const r = sanitizeEntry(raw); if(!r) continue;
      const same = (r.id && lib.find(x=>x.id===r.id)) || lib.find(x=>normTitle(x.title)===normTitle(r.title));
      const id = same ? same.id : (r.id || newId());
      const row = Object.assign(r, {id}); const k = lib.findIndex(x=>x.id===id);
      if(k<0) lib.push(row); else lib[k] = row;
      n++;
    }
    persistLocal(); renderLibrary();
    setLibStatus(n + (n===1 ? " música importada." : " músicas importadas."));
  }catch(err){ setLibStatus("Esse arquivo não parece uma biblioteca exportada."); }
});
(function(){
  const b = document.getElementById("new-seq"); let armed = null;
  b.addEventListener("click", ()=>{
    if(!armed){ b.textContent = "Clique de novo para limpar"; armed = setTimeout(()=>{ armed = null; b.textContent = "Nova sequência"; }, 3500); return; }
    clearTimeout(armed); armed = null; b.textContent = "Nova sequência";
    saveSequenceToLibrary();
    state.songs = [""]; state.keys = []; state.targets = []; state.types = []; state.libIds = [];
    save(); renderEditor(); renderPreview(); renderLibrary();
    setLibStatus("Sequência limpa. As músicas continuam na biblioteca.");
  });
})();
const dd = document.getElementById("dedupe"); dd.checked = state.dedupe;
dd.addEventListener("change", ()=>{ state.dedupe = dd.checked; save(); renderPreview(); });
document.getElementById("add-lyrics").addEventListener("click", ()=>{ state.songs.push(""); state.types[state.songs.length-1] = "letra"; save(); renderEditor(); const t=document.querySelectorAll("textarea"); t[t.length-1].focus(); });
document.getElementById("add").addEventListener("click", ()=>{ state.songs.push(""); state.types[state.songs.length-1] = ""; save(); renderEditor(); const t=document.querySelectorAll("textarea"); t[t.length-1].focus(); });

renderEditor();
initLibrary();
Promise.all(FONTS.map(([f,fam,w])=>{
  try{ const ff = new FontFace(fam, `url(${fontURL(f)})`, {weight:w}); document.fonts.add(ff); return ff.load().catch(()=>null); }catch(e){ return null; }
})).then(()=>{ widths.clear(); renderPreview(); });

renderPreview();
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
