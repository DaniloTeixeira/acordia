<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonora</title>
<meta name="description" content="Sonora: sua música em um só lugar. Repertórios com cifra, graus e letra, folhas A4, modo palco, estudo e metrônomo. Funciona offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sonora">
<link rel="preload" href="fonts/lexend-bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Aplica o tema antes de pintar, para não piscar.
  try{ const t = localStorage.getItem("mg-theme"); if(t === "light" || t === "dark") document.documentElement.dataset.theme = t; }catch(e){}
</script>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/></symbol>
  <symbol id="i-study" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="i-stage" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-7 0-3-2-5.5-3.5-7-.3 2-1.5 3.3-3 3.5C13 8 12 5 9 2c0 4-4 6.5-4 12 0 4.3 3 8 7 8z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-metro" viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/><path d="M12 16l5-9M8 17h8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></symbol>
</svg>

<div class="shell">
  <aside class="rail" data-i18n-attr="aria-label:nav.nav">
    <a class="brand" href="./"><img src="icons/icon.svg" alt=""><span>Sonora<small data-i18n="app.tagline"></small></span></a>
    <button class="nav-item" data-nav="medley"><svg class="i"><use href="#i-music"/></svg><span data-i18n="nav.medley"></span></button>
    <button class="nav-item" data-nav="library"><svg class="i"><use href="#i-library"/></svg><span data-i18n="nav.library"></span><span class="count" data-count="songs"></span></button>
    <button class="nav-item" data-nav="study"><svg class="i"><use href="#i-study"/></svg><span data-i18n="nav.study"></span></button>
    <button class="nav-item" data-nav="tools"><svg class="i"><use href="#i-metro"/></svg><span data-i18n="nav.tools"></span></button>
    <div class="rail-foot">
      <button class="nav-item" data-install hidden><svg class="i"><use href="#i-phone"/></svg><span data-i18n="nav.install"></span></button>
      <button class="nav-item" data-lang-toggle><svg class="i"><use href="#i-globe"/></svg><span></span></button>
      <button class="nav-item" data-theme-toggle><svg class="i"><use href="#i-monitor"/></svg><span></span></button>
    </div>
  </aside>

  <header class="topbar">
    <a class="brand" href="./"><img src="icons/icon.svg" alt=""><span>Sonora</span></a>
    <button class="icon-btn" data-install hidden data-i18n-attr="aria-label:nav.install"><svg class="i"><use href="#i-phone"/></svg></button>
    <button class="icon-btn" data-lang-toggle><svg class="i"><use href="#i-globe"/></svg></button>
    <button class="icon-btn" data-theme-toggle><svg class="i"><use href="#i-monitor"/></svg></button>
  </header>

  <main id="main">
    <!-- ===== Medley ===== -->
    <section class="view" id="view-medley" data-view="medley" aria-labelledby="medley-name">
      <div class="view-head">
        <div class="title-wrap">
          <div class="ctx" id="medley-ctx" hidden><button class="btn ghost sm back" id="ctx-back" hidden><svg class="i sm"><use href="#i-back"/></svg><span id="ctx-back-label"></span></button><span class="chip accent"><svg class="i sm"><use href="#i-link"/></svg><span data-i18n="ctx.medley"></span></span></div>
          <input id="medley-name" class="title-input" data-i18n-attr="aria-label:medley.nameAria" maxlength="80" autocomplete="off">
          <p class="sub" id="medley-sub"></p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-new-medley"><svg class="i"><use href="#i-plus"/></svg><span class="label-lg" data-i18n="medley.new"></span></button>
          <button class="btn ghost" id="btn-share"><svg class="i"><use href="#i-share"/></svg><span class="label-lg" data-i18n="medley.share"></span></button>
          <button class="btn primary" id="btn-stage"><svg class="i"><use href="#i-stage"/></svg><span data-i18n="medley.stage"></span></button>
        </div>
      </div>
      <div class="seg block pane-toggle" id="pane-toggle" role="group" data-i18n-attr="aria-label:pane.aria">
        <button data-v="edit" aria-pressed="true" data-i18n="pane.edit"></button><button data-v="sheet" aria-pressed="false" data-i18n="pane.sheet"></button>
      </div>
      <div class="medley-grid" id="medley-grid" data-pane="edit">
        <div class="pane pane-edit">
          <ol class="items" id="items"></ol>
          <div class="add-bar">
            <button class="btn soft" id="add-chords"><svg class="i"><use href="#i-plus"/></svg><span data-i18n="add.chords"></span></button>
            <button class="btn soft" id="add-lyrics"><svg class="i"><use href="#i-text"/></svg><span data-i18n="add.lyrics"></span></button>
            <button class="btn soft" id="add-library"><svg class="i"><use href="#i-library"/></svg><span data-i18n="add.library"></span></button>
            <button class="btn soft" id="add-medley"><svg class="i"><use href="#i-link"/></svg><span data-i18n="add.medley"></span></button>
          </div>
        </div>
        <div class="pane pane-sheet">
          <div class="sheet-toolbar">
            <div class="seg" id="mode-seg" role="group" data-i18n-attr="aria-label:sheet.modeAria">
              <button data-v="cifras" data-i18n="sheet.chords"></button><button data-v="graus" data-i18n="sheet.degrees"></button><button data-v="letra" data-i18n="sheet.lyrics"></button>
            </div>
            <div class="tools">
              <button class="icon-btn" popovertarget="sheet-options" id="btn-options" data-i18n-attr="aria-label:sheet.options;title:sheet.options"><svg class="i"><use href="#i-sliders"/></svg></button>
              <button class="icon-btn" id="btn-print" data-i18n-attr="aria-label:sheet.print;title:sheet.print"><svg class="i"><use href="#i-print"/></svg></button>
              <button class="btn primary sm" id="btn-pdf"><svg class="i sm"><use href="#i-download"/></svg>PDF</button>
            </div>
          </div>
          <div id="sheet-options" class="popover" popover>
            <h3 data-i18n="sheet.options"></h3>
            <label class="switch"><span data-i18n="opt.dedupe"></span><input type="checkbox" data-opt="dedupe"></label>
            <label class="switch"><span data-i18n="opt.showKey"></span><input type="checkbox" data-opt="showKey"></label>
            <label class="switch"><span data-i18n="opt.transitions"></span><input type="checkbox" data-opt="transitions"></label>
            <label class="switch"><span data-i18n="opt.maxPages"></span><input type="checkbox" data-opt="maxPages"></label>
            <hr>
            <div class="row"><span data-i18n="opt.columns"></span><div class="seg sm" data-opt-seg="columns"><button data-v="auto" data-i18n="opt.auto"></button><button data-v="1">1</button><button data-v="2">2</button></div></div>
            <div class="row"><span data-i18n="opt.degrees"></span><div class="seg sm" data-opt-seg="degreeStyle"><button data-v="roman">I IV V</button><button data-v="arabic">1 4 5</button></div></div>
            <div class="row"><label for="opt-minfont" data-i18n="opt.minFont"></label><select class="input" id="opt-minfont" data-opt="minFont" style="width:auto">
              <option value="7">7 pt</option><option value="8">8 pt</option><option value="9">9 pt</option><option value="10">10 pt</option><option value="11">11 pt</option><option value="12">12 pt</option></select></div>
          </div>
          <p class="note" id="sheet-warn" hidden></p>
          <div class="pages" id="pages"></div>
        </div>
      </div>
    </section>

    <!-- ===== Biblioteca ===== -->
    <section class="view" id="view-library" data-view="library" hidden aria-labelledby="lib-h">
      <div class="view-head">
        <div><h1 id="lib-h" data-i18n="lib.title"></h1><p class="sub" id="lib-sub"></p></div>
        <div class="actions">
          <button class="btn primary" id="lib-new"><svg class="i"><use href="#i-plus"/></svg><span data-i18n="lib.new"></span></button>
          <button class="btn ghost" id="lib-export"><svg class="i"><use href="#i-download"/></svg><span class="label-lg" data-i18n="lib.export"></span></button>
          <label class="btn ghost" tabindex="0" id="lib-import-btn"><svg class="i"><use href="#i-upload"/></svg><span class="label-lg" data-i18n="lib.import"></span><input type="file" id="lib-import" accept="application/json,.json" hidden></label>
        </div>
      </div>
      <div class="seg" id="lib-tabs" role="group" data-i18n-attr="aria-label:lib.tabsAria">
        <button data-v="songs"></button><button data-v="setlists"></button><button data-v="medleys"></button>
      </div>
      <div class="lib-toolbar">
        <div class="search"><svg class="i sm"><use href="#i-search"/></svg><input type="search" class="input" id="lib-q" data-i18n-attr="placeholder:lib.search;aria-label:lib.searchAria"></div>
        <div class="seg sm" id="lib-filter" role="group" data-i18n-attr="aria-label:lib.filterAria"><button data-v="all" data-i18n="lib.all"></button><button data-v="chords" data-i18n="lib.withChords"></button><button data-v="letra" data-i18n="lib.lyricsOnly"></button></div>
        <select class="input" id="lib-sort" style="width:auto" data-i18n-attr="aria-label:lib.sortAria"><option value="az" data-i18n="lib.az"></option><option value="recent" data-i18n="lib.recent"></option></select>
      </div>
      <ul class="cards" id="lib-list"></ul>
    </section>

    <!-- ===== Estudo ===== -->
    <section class="view" id="view-study" data-view="study" hidden aria-labelledby="study-h">
      <div class="view-head"><div><h1 id="study-h" data-i18n="study.title"></h1><p class="sub" data-i18n="study.sub"></p></div></div>
      <div class="seg" id="study-tabs" role="group" data-i18n-attr="aria-label:study.tabsAria">
        <button data-v="explore" data-i18n="study.explore"></button><button data-v="train" data-i18n="study.train"></button><button data-v="hands" data-i18n="study.hands"></button>
      </div>
      <div id="study-explore"></div>
      <div id="study-train" hidden></div>
      <div id="study-hands" hidden></div>
    </section>

    <!-- ===== Ferramentas ===== -->
    <section class="view" id="view-tools" data-view="tools" hidden aria-labelledby="tools-h">
      <div class="view-head"><div><h1 id="tools-h" data-i18n="tools.title"></h1><p class="sub" data-i18n="tools.sub"></p></div></div>
      <div class="seg" id="tools-tabs" role="group" data-i18n-attr="aria-label:tools.title">
        <button data-v="metro" data-i18n="tools.metro"></button><button data-v="tuner" data-i18n="tools.tuner"></button>
      </div>
      <div id="tools-metro"></div>
      <div id="tools-tuner" hidden></div>
    </section>
  </main>

  <nav class="tabbar" data-i18n-attr="aria-label:nav.nav">
    <button class="tab" data-nav="medley"><span class="pill"><svg class="i"><use href="#i-music"/></svg></span><span data-i18n="nav.medley"></span></button>
    <button class="tab" data-nav="library"><span class="pill"><svg class="i"><use href="#i-library"/></svg></span><span data-i18n="nav.library"></span></button>
    <button class="tab" data-nav="study"><span class="pill"><svg class="i"><use href="#i-study"/></svg></span><span data-i18n="nav.study"></span></button>
    <button class="tab" data-nav="tools"><span class="pill"><svg class="i"><use href="#i-metro"/></svg></span><span data-i18n="nav.tools"></span></button>
  </nav>
</div>

<!-- ===== Modo palco ===== -->
<div class="stage" id="stage" hidden role="dialog" aria-modal="true" data-i18n-attr="aria-label:stage.aria">
  <div class="stage-bar">
    <button class="icon-btn" id="stage-close" data-i18n-attr="aria-label:stage.close"><svg class="i"><use href="#i-x"/></svg></button>
    <div class="seg sm" id="stage-mode" role="group" data-i18n-attr="aria-label:stage.modeAria"><button data-v="cifras" data-i18n="sheet.chords"></button><button data-v="graus" data-i18n="sheet.degrees"></button><button data-v="letra" data-i18n="sheet.lyricsShort"></button></div>
    <span class="grow"></span>
    <button class="icon-btn" id="stage-metro" aria-pressed="false" data-i18n-attr="aria-label:metro.title;title:metro.title"><svg class="i"><use href="#i-metro"/></svg></button>
    <button class="icon-btn" id="stage-smaller" data-i18n-attr="aria-label:stage.smaller"><b>A−</b></button>
    <button class="icon-btn" id="stage-bigger" data-i18n-attr="aria-label:stage.bigger"><b>A+</b></button>
  </div>
  <div class="stage-metro" id="stage-metro-panel" hidden></div>
  <div class="stage-scroll" id="stage-scroll" tabindex="0"><div class="stage-content" id="stage-content"></div></div>
</div>

<!-- ===== Diálogos ===== -->
<dialog id="dlg-picker" aria-labelledby="picker-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="picker-h" data-i18n="picker.title"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <div class="search"><svg class="i sm"><use href="#i-search"/></svg><input type="search" class="input" id="picker-q" data-i18n-attr="placeholder:picker.search;aria-label:picker.searchAria"></div>
      <ul class="pick-list" id="picker-list"></ul>
    </div>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" data-i18n="common.cancel"></button><button class="btn primary" value="ok" id="picker-ok" disabled data-i18n="common.add"></button></div>
  </form>
</dialog>

<dialog id="dlg-song" aria-labelledby="song-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="song-h">Música</h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <div class="seg sm" id="song-type" role="group" data-i18n-attr="aria-label:song.typeAria"><button type="button" data-v="" data-i18n="item.withChords"></button><button type="button" data-v="letra" data-i18n="item.lyricsOnly"></button></div>
      <textarea class="input song-text" id="song-text" spellcheck="false" data-i18n-attr="aria-label:song.textAria;placeholder:item.phChords"></textarea>
      <div class="fields">
        <label class="field"><span data-i18n="song.key"></span><select class="input" id="song-key"></select></label>
        <label class="field"><span data-i18n="item.bpm"></span><input class="input" id="song-bpm" type="number" inputmode="numeric" min="20" max="300" placeholder="—"></label>
        <label class="field wide"><span data-i18n="item.ref"></span><input class="input" id="song-ref" type="url" inputmode="url" autocomplete="off" data-i18n-attr="placeholder:item.refPh"></label>
      </div>
    </div>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" data-i18n="common.cancel"></button><button class="btn primary" value="ok" data-i18n="common.save"></button></div>
  </form>
</dialog>

<dialog id="dlg-share" aria-labelledby="share-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="share-h" data-i18n="share.title"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <p data-i18n="share.desc"></p>
      <div class="link-box"><input class="input" id="share-url" readonly data-i18n-attr="aria-label:share.urlAria"><button type="button" class="btn primary" id="share-copy"><svg class="i sm"><use href="#i-copy"/></svg><span data-i18n="common.copy"></span></button></div>
      <p class="sub" id="share-size"></p>
    </div>
    <div class="dlg-foot"><button type="button" class="btn ghost" id="share-native" hidden><svg class="i sm"><use href="#i-share"/></svg><span data-i18n="share.send"></span></button><button class="btn ghost" value="cancel" data-i18n="common.close"></button></div>
  </form>
</dialog>

<dialog id="dlg-incoming" aria-labelledby="incoming-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="incoming-h" data-i18n="incoming.title"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body"><p id="incoming-desc"></p><ol class="steps" id="incoming-list"></ol></div>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" data-i18n="incoming.later"></button><button class="btn primary" value="ok" data-i18n="incoming.save"></button></div>
  </form>
</dialog>

<dialog id="dlg-install" aria-labelledby="install-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="install-h" data-i18n="install.title"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <ol class="steps">
        <li data-i18n-html="install.s1"></li>
        <li data-i18n-html="install.s2"></li>
        <li data-i18n-html="install.s3"></li>
      </ol>
      <p class="sub" data-i18n="install.sub"></p>
    </div>
    <div class="dlg-foot"><button class="btn primary" value="ok" data-i18n="common.gotIt"></button></div>
  </form>
</dialog>

<dialog id="dlg-arr" aria-labelledby="arr-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="arr-h" data-i18n="arr.dlgTitle"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body"><p class="sub" data-i18n="arr.dlgText"></p><label class="field"><span data-i18n="arr.name"></span><input class="input" id="arr-name" maxlength="60" data-i18n-attr="placeholder:arr.namePh"></label></div>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" data-i18n="common.cancel"></button><button class="btn primary" value="ok" data-i18n="common.save"></button></div>
  </form>
</dialog>

<dialog id="dlg-chord" class="chord-dlg" aria-labelledby="chord-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="chord-h"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body"></div>
  </form>
</dialog>

<dialog id="dlg-player" class="player" aria-labelledby="player-h">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="player-h"></h2><button class="icon-btn" value="cancel" data-i18n-attr="aria-label:common.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-body">
      <p class="note" id="player-offline" hidden data-i18n="ref.offline"></p>
      <div class="player-box" id="player-box"></div>
    </div>
    <div class="dlg-foot"><a class="btn ghost" id="player-open" target="_blank" rel="noopener" data-i18n="ref.open"></a><button class="btn primary" value="cancel" data-i18n="common.close"></button></div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
