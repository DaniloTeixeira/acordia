name: Manter o banco dev ativo

# O plano gratuito do Supabase pausa o projeto sem uso por cerca de 7 dias (o dev é o que mais fica parado).
# Uma chamada a cada 3 ou 4 dias (segunda e quinta) conta como atividade e evita a pausa. Grava a hora numa tabela de uma linha (função keepalive).
# Precisa dos secrets DEV_SUPABASE_URL e DEV_SUPABASE_KEY (a URL e a chave publishable do projeto acordia-dev).
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o banco dev
        env:
          URL: ${{ secrets.DEV_SUPABASE_URL }}
          KEY: ${{ secrets.DEV_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Faltam os secrets DEV_SUPABASE_URL e DEV_SUPABASE_KEY."; exit 1; fi
          # Chama a função keepalive(), que grava a hora numa tabela de uma linha (atividade de escrita de
          # verdade; só ela é aberta ao anon). Projeto pausado ou fora do ar responde outra coisa e o job falha.
          code=$(curl --silent --max-time 30 -X POST -o resp.json -w '%{http_code}' -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' "$URL/rest/v1/rpc/keepalive" || true)
          echo "HTTP $code"
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then echo "Banco dev respondeu."; exit 0; fi
          cat resp.json 2>/dev/null; exit 1
