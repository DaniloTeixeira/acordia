name: Manter o banco dev ativo

# O plano gratuito do Supabase pausa o projeto sem uso por cerca de 7 dias (o dev é o que mais fica parado).
# Uma leitura por dia conta como atividade e evita a pausa. Não escreve nada no banco.
# Precisa dos secrets DEV_SUPABASE_URL e DEV_SUPABASE_KEY (a URL e a chave anon do projeto acordia-dev).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o banco dev
        env:
          URL: ${{ secrets.DEV_SUPABASE_URL }}
          KEY: ${{ secrets.DEV_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Faltam os secrets DEV_SUPABASE_URL e DEV_SUPABASE_KEY."; exit 1; fi
          # O PostgREST responde o esquema na raiz; basta o banco acordar para contar como uso.
          curl --fail --silent --show-error --max-time 30 -o /dev/null -H "apikey: $KEY" "$URL/rest/v1/"
