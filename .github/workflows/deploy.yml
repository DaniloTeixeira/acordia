name: Testar e publicar

# PR: testa o app e as migrações (o merge na main só libera com os dois passando).
# Push na main: testa, publica no GitHub Pages e marca a versão com uma tag (vAAAA.MM.DD-N).
# Voltar uma versão: Actions > Testar e publicar > Run workflow, com a tag no campo "versao".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag para publicar de novo (ex.: v2026.10.18-1). Vazio = a main atual."
        required: false
        default: ""

permissions:
  contents: read

# Um PR novo cancela o teste antigo do mesmo PR; na main, um deploy nunca é cortado no meio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        # Login (Supabase): variáveis do repositório. Sem elas, o app não abre.
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Sobe um Supabase vazio no próprio runner e aplica todas as migrações do zero. Erro de SQL aparece
  # aqui, não no banco de produção.
  migrations:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # O config.toml não fica no repositório (a integração do Supabase com o GitHub o aplicaria na
      # produção); aqui ele só existe no runner.
      - run: supabase init --force --yes
      # Aplica as migrações em ordem, como a produção recebe; para no primeiro erro.
      - run: supabase db start

  deploy:
    needs: [test, migrations]
    # Na volta de versão o job de migrações é pulado; o deploy segue mesmo assim.
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Marca cada versão publicada pela main, para dar para voltar a ela.
  tag:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          day="v$(date -u +%Y.%m.%d)"
          n=$(( $(git tag -l "$day-*" | wc -l) + 1 ))
          git tag "$day-$n" "$GITHUB_SHA"
          git push origin "$day-$n"
          echo "Publicado como $day-$n" >> "$GITHUB_STEP_SUMMARY"
